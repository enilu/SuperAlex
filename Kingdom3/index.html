<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国演义知识闯关</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" sizes="any">
    <link rel="icon" type="image/svg+xml" href="favicon-small.svg" sizes="16x16">
    <link rel="stylesheet" href="assets/css/game.css">
</head>
<body>
    <!-- 主容器 -->
    <div id="app">

        <!-- 开始界面 -->
        <div id="start-screen" class="screen active">
            <div class="container">
                <div class="title-card">
                    <h1 class="game-title">三国演义</h1>
                    <h2 class="game-subtitle">知识闯关</h2>
                    <div class="decorative-line"></div>
                </div>

                <div class="level-selection">
                    <h3 class="section-title">选择关卡</h3>
                    <div class="levels-grid">
                        <div class="level-card" data-level="1" id="level-1">
                            <div class="level-icon">🎯</div>
                            <div class="level-name">人物小达人</div>
                            <div class="level-stars" id="stars-1"></div>
                            <div class="level-lock" id="lock-1" style="display: none;">🔒</div>
                        </div>

                        <div class="level-card" data-level="2" id="level-2">
                            <div class="level-icon">📖</div>
                            <div class="level-name">情节小能手</div>
                            <div class="level-stars" id="stars-2"></div>
                            <div class="level-lock" id="lock-2">🔒</div>
                        </div>

                        <div class="level-card" data-level="3" id="level-3">
                            <div class="level-icon">⚔️</div>
                            <div class="level-name">道具配对师</div>
                            <div class="level-stars" id="stars-3"></div>
                            <div class="level-lock" id="lock-3">🔒</div>
                        </div>

                        <div class="level-card" data-level="4" id="level-4">
                            <div class="level-icon">🏆</div>
                            <div class="level-name">趣味小问答</div>
                            <div class="level-stars" id="stars-4"></div>
                            <div class="level-lock" id="lock-4">🔒</div>
                        </div>
                    </div>
                </div>

                <div class="bottom-buttons">
                    <button class="btn-secondary" id="btn-settings">
                        <span class="btn-icon">⚙️</span>
                        <span class="btn-text">设置</span>
                    </button>
                    <button class="btn-secondary" id="btn-question-manager">
                        <span class="btn-icon">📝</span>
                        <span class="btn-text">题库管理</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 游戏界面 -->
        <div id="game-screen" class="screen">
            <div class="container">
                <!-- 游戏头部 -->
                <div class="game-header">
                    <button class="btn-back" id="btn-back">
                        <span>←</span>
                    </button>
                    <div class="level-info">
                        <span id="current-level-name">第一关</span>
                    </div>
                    <div class="score-display">
                        <span>答对: <strong id="correct-count">0</strong></span>
                    </div>
                </div>

                <!-- 进度条 -->
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
                    </div>
                    <div class="progress-text">
                        <span id="progress-text">第 1/5 题</span>
                    </div>
                </div>

                <!-- 题目卡片 -->
                <div class="question-card" id="question-card">
                    <div class="question-number" id="question-number">题目 1</div>
                    <div class="question-pinyin" id="question-pinyin"></div>
                    <div class="question-content" id="question-content">
                        题目加载中...
                    </div>
                </div>

                <!-- 选项区 -->
                <div class="options-container" id="options-container">
                    <button class="option-btn" data-option="A" id="option-a">
                        <span class="option-label">A</span>
                        <span class="option-text" id="option-text-a">选项A</span>
                    </button>
                    <button class="option-btn" data-option="B" id="option-b">
                        <span class="option-label">B</span>
                        <span class="option-text" id="option-text-b">选项B</span>
                    </button>
                    <button class="option-btn" data-option="C" id="option-c">
                        <span class="option-label">C</span>
                        <span class="option-text" id="option-text-c">选项C</span>
                    </button>
                </div>

                <!-- 反馈区域 -->
                <div class="feedback-area" id="feedback-area"></div>

                <!-- 复活按钮 -->
                <div class="revive-container" id="revive-container" style="display: none;">
                    <button class="btn-revive" id="btn-revive">
                        <span class="revive-icon">💡</span>
                        <span class="revive-text">使用提示复活</span>
                    </button>
                    <p class="revive-hint">高亮关键词，帮助你找到答案</p>
                </div>
            </div>
        </div>

        <!-- 结果界面 -->
        <div id="result-screen" class="screen">
            <div class="container">
                <div class="result-card">
                    <div class="result-icon" id="result-icon">🎉</div>
                    <h2 class="result-title" id="result-title">闯关成功！</h2>
                    <div class="result-stars" id="result-stars">
                        <span class="star">⭐</span>
                        <span class="star">⭐</span>
                        <span class="star">⭐</span>
                    </div>

                    <div class="result-stats">
                        <div class="stat-item">
                            <div class="stat-label">答对题数</div>
                            <div class="stat-value" id="result-correct">3</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">答错题数</div>
                            <div class="stat-value" id="result-wrong">2</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">得分</div>
                            <div class="stat-value" id="result-score">60</div>
                        </div>
                    </div>

                    <div class="result-message" id="result-message">
                        太棒了！你已经掌握了三国知识！
                    </div>
                </div>

                <div class="result-actions" id="result-actions">
                    <button class="btn-primary" id="btn-retry">
                        <span class="btn-icon">🔄</span>
                        <span class="btn-text">重新挑战</span>
                    </button>
                    <button class="btn-success" id="btn-next" style="display: none;">
                        <span class="btn-icon">➡️</span>
                        <span class="btn-text">下一关</span>
                    </button>
                    <button class="btn-home" id="btn-home">
                        <span class="btn-icon">🏠</span>
                        <span class="btn-text">返回主页</span>
                    </button>
                </div>

                <!-- 证书按钮（通关后显示） -->
                <div class="certificate-section" id="certificate-section" style="display: none;">
                    <button class="btn-certificate" id="btn-certificate">
                        <span class="btn-icon">📜</span>
                        <span class="btn-text">查看荣誉证书</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 证书界面 -->
        <div id="certificate-screen" class="screen">
            <div class="container">
                <div class="certificate-card" id="certificate-card">
                    <div class="certificate-border"></div>
                    <div class="certificate-header">
                        <div class="certificate-seal">🏆</div>
                        <h1 class="certificate-title">荣誉证书</h1>
                    </div>

                    <div class="certificate-body">
                        <p class="certificate-text">
                            <span class="certificate-name">三国小达人</span>：
                        </p>
                        <p class="certificate-text">
                            恭喜你完成了所有关卡！
                        </p>
                        <p class="certificate-text">
                            在三国演义知识闯关中表现出色，
                        </p>
                        <p class="certificate-text">
                            特发此证，以资鼓励！
                        </p>

                        <div class="certificate-stats">
                            <div class="cert-stat">
                                <span class="cert-label">总答对</span>
                                <span class="cert-value" id="cert-total-correct">20</span>
                            </div>
                            <div class="cert-stat">
                                <span class="cert-label">总得分</span>
                                <span class="cert-value" id="cert-total-score">100</span>
                            </div>
                        </div>
                    </div>

                    <div class="certificate-footer">
                        <div class="certificate-date" id="certificate-date">2024年2月19日</div>
                    </div>
                </div>

                <div class="certificate-actions">
                    <button class="btn-secondary" id="btn-back-cert">
                        <span class="btn-icon">←</span>
                        <span class="btn-text">返回</span>
                    </button>
                    <button class="btn-primary" id="btn-share">
                        <span class="btn-icon">📸</span>
                        <span class="btn-text">截图保存</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 设置界面 -->
        <div id="settings-screen" class="screen">
            <div class="container">
                <div class="settings-card">
                    <div class="settings-header">
                        <button class="btn-back" id="btn-back-settings">
                            <span>←</span>
                        </button>
                        <h2>设置</h2>
                    </div>

                    <div class="settings-content">
                        <div class="setting-item">
                            <div class="setting-label">
                                <span class="setting-icon">🔊</span>
                                <span>音效</span>
                            </div>
                            <label class="toggle">
                                <input type="checkbox" id="toggle-sound" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>

                        <div class="setting-item">
                            <div class="setting-label">
                                <span class="setting-icon">🎵</span>
                                <span>背景音乐</span>
                            </div>
                            <label class="toggle">
                                <input type="checkbox" id="toggle-music">
                                <span class="toggle-slider"></span>
                            </label>
                        </div>

                        <div class="setting-item">
                            <div class="setting-label">
                                <span class="setting-icon">📝</span>
                                <span>显示拼音</span>
                            </div>
                            <label class="toggle">
                                <input type="checkbox" id="toggle-pinyin" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    </div>

                    <div class="settings-actions">
                        <button class="btn-danger" id="btn-reset-progress">
                            <span class="btn-icon">🗑️</span>
                            <span class="btn-text">重置进度</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 题库管理界面 -->
        <div id="question-manager-screen" class="screen">
            <div class="container">
                <div class="manager-header">
                    <button class="btn-back" id="btn-back-manager">
                        <span>←</span>
                    </button>
                    <h2>题库管理</h2>
                </div>

                <div class="manager-tabs">
                    <button class="tab-btn active" data-tab="list" id="tab-list">题目列表</button>
                    <button class="tab-btn" data-tab="add" id="tab-add">添加题目</button>
                </div>

                <!-- 题目列表 -->
                <div class="manager-content" id="manager-list">
                    <div class="filter-section">
                        <label>筛选关卡:</label>
                        <select id="filter-level">
                            <option value="all">全部</option>
                            <option value="1">第一关 - 人物小达人</option>
                            <option value="2">第二关 - 情节小能手</option>
                            <option value="3">第三关 - 道具配对师</option>
                            <option value="4">第四关 - 趣味小问答</option>
                        </select>
                    </div>

                    <div class="questions-list" id="questions-list">
                        <p class="empty-hint">题目加载中...</p>
                    </div>
                </div>

                <!-- 添加/编辑题目 -->
                <div class="manager-content" id="manager-add" style="display: none;">
                    <div class="question-form">
                        <div class="form-group">
                            <label for="form-question">题目内容</label>
                            <textarea id="form-question" rows="3" placeholder="请输入题目内容"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="form-option-a">选项 A</label>
                            <input type="text" id="form-option-a" placeholder="请输入选项A">
                        </div>

                        <div class="form-group">
                            <label for="form-option-b">选项 B</label>
                            <input type="text" id="form-option-b" placeholder="请输入选项B">
                        </div>

                        <div class="form-group">
                            <label for="form-option-c">选项 C</label>
                            <input type="text" id="form-option-c" placeholder="请输入选项C">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="form-answer">正确答案</label>
                                <select id="form-answer">
                                    <option value="">请选择</option>
                                    <option value="A">A</option>
                                    <option value="B">B</option>
                                    <option value="C">C</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="form-level">所属关卡</label>
                                <select id="form-level">
                                    <option value="">请选择</option>
                                    <option value="1">第一关</option>
                                    <option value="2">第二关</option>
                                    <option value="3">第三关</option>
                                    <option value="4">第四关</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="form-hint">提示关键词（复活时显示）</label>
                            <input type="text" id="form-hint" placeholder="请输入提示关键词">
                        </div>

                        <div class="form-actions">
                            <button class="btn-secondary" id="btn-form-cancel">取消</button>
                            <button class="btn-primary" id="btn-form-save">保存</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载JavaScript文件 -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/cacheManager.js"></script>
    <script src="assets/js/audioManager.js"></script>
    <script src="assets/js/questionManager.js"></script>
    <script src="assets/js/progressManager.js"></script>
    <script src="assets/js/uiManager.js"></script>
    <script src="assets/js/gameManager.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
