<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#c94b4b">
    <meta name="description" content="儿童晨间流程激励游戏，帮助孩子养成良好的早晨习惯">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="晨光冲锋队">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>晨光冲锋队 - 儿童晨间流程激励游戏</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- 首次访问引导层 -->
    <div id="introOverlay" class="overlay">
        <div class="intro-content">
            <h2>欢迎来到晨光冲锋队！</h2>
            <p>这是你的早晨闯关游戏！每完成一步，点这里✅</p>
            <button id="startButton">开始游戏</button>
        </div>
    </div>

    <!-- 任务选择界面 -->
    <div id="taskSelectionContainer" class="container hidden">
        <!-- 顶部状态栏 -->
        <div class="game-header">
            <button id="backButtonSelection" class="btn-back"><span class="icon-slot" data-icon="arrow-left" data-size="24"></span></button>
            <div class="header-info">
                <div id="currentDateSelection" class="date">2023年7月15日 星期六</div>
            </div>
            <button id="settingsButtonSelection" class="btn-settings"><span class="icon-slot" data-icon="settings" data-size="24"></span></button>
        </div>

        <!-- 成就统计 -->
        <div class="achievement-bar">
            <div id="achievementCountSelection" class="achievement-text">闪电完成: 0</div>
        </div>

        <h1 class="selection-title">选择要完成的任务</h1>
        <p class="selection-subtitle">点击一个任务开始挑战</p>

        <!-- 任务列表 -->
        <div id="taskList" class="task-list">
            <!-- 任务项将动态生成 -->
        </div>

        <!-- 完成进度 -->
        <div class="completion-progress">
            <div class="progress-text" id="completionProgressText">已完成: 0/4</div>
            <div class="progress-bar-container">
                <div id="completionProgressBar" class="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <!-- 主游戏界面 -->
    <div id="gameContainer" class="container hidden">
        <!-- 顶部状态栏 -->
        <div class="game-header">
            <button id="backButton" class="btn-back hidden"><span class="icon-slot" data-icon="arrow-left" data-size="24"></span></button>
            <div class="header-info">
                <div id="currentDate" class="date">2023年7月15日 星期六</div>
            </div>
            <button id="settingsButton" class="btn-settings"><span class="icon-slot" data-icon="settings" data-size="24"></span></button>
        </div>

        <!-- 成就统计 -->
        <div class="achievement-bar">
            <div id="achievementCount" class="achievement-text">闪电完成: 0</div>
        </div>

        <!-- 任务卡片 -->
        <div class="task-card">
            <div class="task-icon" id="taskIcon">🛏️</div>
            <h1 id="taskName" class="task-name">准备开始</h1>
            <div class="timer-container">
                <div id="countdown" class="countdown">00:00</div>
                <div id="timeStatus" class="time-status">准备开始</div>
            </div>
            <button id="completeButton" class="complete-button">✅ 我完成了！</button>
        </div>

        <!-- 进度条 -->
        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
            <div class="progress-text" id="progressText">0/4</div>
        </div>

        <!-- 勋章展示区域 -->
        <div id="medalSection" class="medal-section hidden">
            <div class="medal-icon">🏆</div>
            <h2 id="medalTitle" class="medal-title"></h2>
            <p id="medalDescription" class="medal-description"></p>
        </div>
    </div>

    <!-- 完成所有任务的庆祝界面 -->
    <div id="celebrationScreen" class="overlay hidden">
        <div class="celebration-content">
            <h1>🎉 恭喜！</h1>
            <p id="celebrationMessage">今日晨光冲锋圆满完成！你真棒！</p>
            <p>准备出发上学吧！</p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button id="closeCelebrationButton" class="celebration-close-button">太棒了！</button>
                <button id="restartButton" class="celebration-close-button" style="background: linear-gradient(135deg, #4ECDC4 0%, #44a08d 100%);">重新开始</button>
            </div>
        </div>
    </div>
    
    

    <!-- 使用ES模块方式引入主应用，内部会自动加载其他依赖 -->
    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
