<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 背景圆形 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <!-- 书卷图标 -->
  <rect x="16" y="18" width="32" height="28" rx="2" fill="#fff" opacity="0.95"/>
  <rect x="18" y="20" width="28" height="24" rx="1" fill="#f093fb" opacity="0.2"/>
  <!-- 文字线条 -->
  <rect x="20" y="24" width="16" height="2" rx="1" fill="#f5576c"/>
  <rect x="20" y="28" width="20" height="2" rx="1" fill="#f5576c" opacity="0.7"/>
  <rect x="20" y="32" width="18" height="2" rx="1" fill="#f5576c" opacity="0.7"/>
  <rect x="20" y="36" width="14" height="2" rx="1" fill="#f5576c" opacity="0.7"/>
  <!-- 卷曲效果 -->
  <path d="M16 42 Q12 40 16 38" stroke="#fff" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M48 42 Q52 40 48 38" stroke="#fff" stroke-width="2" fill="none" opacity="0.6"/>
