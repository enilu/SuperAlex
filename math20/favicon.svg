<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 背景圆形 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <!-- 数字卡片 -->
  <rect x="10" y="16" width="20" height="28" rx="4" fill="#fff" opacity="0.95"/>
  <rect x="34" y="16" width="20" height="28" rx="4" fill="#fff" opacity="0.95"/>
  <!-- 数字 -->
  <text x="20" y="36" font-size="18" font-weight="bold" fill="#4facfe" text-anchor="middle">2</text>
  <text x="44" y="36" font-size="18" font-weight="bold" fill="#00f2fe" text-anchor="middle">0</text>
  <!-- 加号 -->
  <text x="32" y="36" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
</svg>
