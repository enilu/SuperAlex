<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="儿童轻量小游戏模板">
  <title>小游戏模板</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="app">
    <header class="panel">
      <h1>小游戏模板</h1>
      <p>复制该目录后改名，即可开发新游戏。</p>
    </header>

    <section class="panel">
      <p id="status">点击按钮开始一局。</p>
      <button id="startBtn" type="button">开始</button>
      <button id="actionBtn" type="button" disabled>点我 +1</button>
      <p id="score">当前分数：0</p>
      <p id="best">历史最高：0</p>
    </section>
  </main>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
